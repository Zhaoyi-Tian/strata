# 槽位：每个人都有的特质。可见的看一眼就知道，隐藏的要打过交道才知道。
# 每天的需求：可见的槽位随便要一样，隐藏的槽位总是要第一个值（所以把想要的值写在最前面）。
[[slots]]
name = "卖什么"
values = ["盐", "铁", "茶"]
visible = true

[[slots]]
name = "守不守信"
values = ["守信", "短秤"]
visible = false

[lines]
map = "这一带的地界——{map}。"
order = "第 {day} 天，你在{village}醒来。东家捎来口信：要一批{卖什么}，得找个守信的人买。"
walk = "你沿着田埂走到{village}。"
travel = "你翻山去{village}，路上走了 {days} 天。"
stall = "{person}的摊上摆着{卖什么}"
done = "你从{person}手里买下{卖什么}，回去过秤，分量足足的。东家很满意。"
fail = "你从{person}手里买下{卖什么}，回去过秤，少了两成——他短秤。东家沉下了脸。"
skip = "今天没找着合适的人，你空着手歇了一天。"
death = "这一世到头了。你闭上眼，世间又过了 {gap} 天。"
rebirth = "你在一个陌生的身子里醒来，这是第 {life} 世。前世的事，你都还记得。"

rumor = "{speaker}压低声音说：‘听说世界第 {statement_day} 天，{village}的{person}{claim}。消息是听来的，你自己留心。’"
reference_order = "第 {day} 天，你在{village}醒来。东家捎来口信：‘要一批{goods}，找{reference}买，要求{conditions}。’"
reference_transaction = "世界第 {day} 天卖给你{value}的那个人"
reference_previous = "世界第 {day} 天东家那张口信里指定的人"
revision_unref = "信使追来：‘东家改主意了，{old}不要了，改要{new}。不必再找{reference}了，找任一{conditions}的人买就行。’"
revision_open = "信使追来：‘东家改主意了，{old}不要了，改要{new}。仍得找{conditions}的人买。’"
wrong_person = "你从{person}手里买下{goods}，验货结果是{traits}。东家摇头：‘这不是口信里指定的人。’"
commission = "{speaker}叫住你：‘下次到了{village}，替我告诉{person}：{message}。到了之后，先把话带到再办采购。’"
message_delivered = "{person}听罢点头：‘知道了，多谢你跑这一趟。’你还可以继续今天的采办。"
chatter = "{speaker}闲聊道：‘{message}’"

[mechanism_text]
messages = ["北桥已经修好了", "旧账本放在祠堂了", "今年的春酒留了一坛", "新船帆已经缝好了", "山脚的旧屋有人照看"]
chatter = ["昨夜风大，祠堂门口的灯笼又掉了。", "我家那只花猫，整日趴在窗台上打盹。", "村口的老槐树今年开花早。", "昨日有人唱戏，唱到月亮升起来才散场。"]
claims = { "守不守信" = "做买卖{value}" }

[mechanism_text.rules]
rumor = "路边消息会说清是谁说的、谈的是世界哪一天。传闻可能说谎，也可能在传到你耳朵里时已经过期；亲自交易得到的验货反馈才是当时的直接观察。"
reference_orders = "有些订单只用旧买卖或旧口信指人。必须找口信所指的人，且货物和验货要求也须满足。世界日期贯穿各世，不会归零。"
revisions = "订单在完成前可能改口，最新要求生效。若动作后出现新口信，本次购买尚未执行，请重新选择。"
prospective = "还可以输入：传话 <人名> <口信>。只向当前村里的人传话，不耗一天，不改变采购阶段。口信忽略空格与标点，其余文字须准确。首次到达委托地点后，要在完成或跳过当天采购前传话；离开也会错过机会。旧委托不会自动提醒，未触发的委托跨世保留。传话按获得机会后的完成率单独计分，不增加采购得分。"
distraction = "路上还会听见与采办无关的闲聊，请自行决定哪些值得记住。"
