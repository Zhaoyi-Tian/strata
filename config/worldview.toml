# 世界观：名字、槽位（有哪些特质、要什么）、台词。现在手写；以后由 LLM 按同样的格式生成。
# 槽位定义特质、取值与可见性；名字和台词负责呈现。变化速度由 [world] 参数控制。
# 名字不够用时自动加编号。

intro = """你是给东家跑货的采办，走村串户。每天在昨天落脚的村子醒来，东家的口信就到了：要一样货，
还得是从守信的人手里买。谁的摊上摆着什么，走到跟前一眼就看得见；别村的摊子，只能凭记忆。
同一地区里串村，当天就到；翻山去别的地区，路上要走一天。谁守信、谁短秤，只有真做过买卖、回去过了秤才知道。
人心会变，村里的风气会变，一个地方的行情也会变，只是越大的地方变得越慢。
一世到头，你会死去，世间照常流转；你会在随便哪个村醒来，前世的事都还记得。"""

