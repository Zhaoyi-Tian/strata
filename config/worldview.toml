# 槽位：每个人都有的特质。可见的看一眼就知道，隐藏的要打过交道才知道。
# 每天的需求：可见的槽位随便要一样，隐藏的槽位总是要第一个值（所以把想要的值写在最前面）。
[[slots]]
name = "卖什么"
values = ["盐", "铁", "茶"]
visible = true

[[slots]]
name = "守不守信"
values = ["守信", "短秤"]
visible = false

[lines]
map = "这一带的地界——{map}。"
order = "第 {day} 天，你在{village}醒来。东家捎来口信：要一批{卖什么}，得找个守信的人买。"
walk = "你沿着田埂走到{village}。"
